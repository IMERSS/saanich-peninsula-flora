# The data files which the project's story page reads at runtime, named once here: R/build.R publishes each from
# tabular_data into static/local/data/tabular, and src/js/storyBuild.js ("npm run story") names them in the layer
# bioreportr.storyData, written into static/story/bioreportr-storyData.vue. The files which only prepare these are
# named in bioreportr-prep.yaml.
# This file is the project's own, and is not copied by copyFrameworkOut.sh
data:
  # The catalogue labelled with the regions its records fall in, and the index of its regions, written by
  # scripts/intersectShapes.R
  labels: Saanich_Tracheophyta_ultimate-catalogue_2026-11-15-selected-labels.csv
  regionIndirection: Saanich_Tracheophyta_ultimate-catalogue_2026-11-15-selected-regionIndirection.csv
  # The summary of the catalogue's taxa
  summary: Saanich_Tracheophyta_ultimate-summary_2026-11-15-prepared-taxa.csv
  # The history of the curatorial notes on each taxon, prepared by scripts/prepare_curation_history.R
  curationHistory: Saanich_Tracheophyta_curation-history_2026-11-15.csv
  # The annotations of records, e.g. of planted populations, applied by scripts/apply_record_annotations.R
  recordAnnotations: Saanich_Tracheophyta_record-annotations_2026-11-15.csv
  # The taxa kept off the list - those set aside on the working list, and those of the penultimate catalogue never
  # listed - prepared by scripts/prepare_excluded_taxa.R
  excludedTaxa: Saanich_Tracheophyta_excluded-taxa_2026-11-15.csv
# The settings which the project's R scripts and its story page share, named once here: its R scripts read them from this
# file, and src/js/storyBuild.js ("npm run story") writes each into the layer bioreportr.storyData as a member of the same
# name - see the defaults of bioreportr.storyPage
settings:
  # Whether the Protected Areas pane, and its summaries written by scripts/Protected_map_mapbox.R, keep only the records
  # which can be mapped. The Saanich Peninsula's records nearly all have positions, so it keeps them all
  protectedMappedOnly: false
