# The token exchange of bioReportR's community curation, as a Cloudflare Worker - see notes/curation-token-exchange.md.
# NOTE: since November 2026 the deployed Worker is managed by OpenTofu, from curation.tf in the imerss-cloudflare
# repository, which holds its own copy of oauthWorker.mjs and the values of [vars] below. Make changes there and run
# "tofu apply" - don't run "npx wrangler deploy" from here, which would overwrite it. This file is kept for reference,
# and so that "npx wrangler tail" still knows the Worker's name. Its secrets are kept there too, encrypted with sops.
name = "bioreportr-curation"
main = "oauthWorker.mjs"
compatibility_date = "2026-11-01"

[vars]
# The Client ID of the GitHub App
CLIENT_ID = "Iv23lit2cc6V6IGqh6L7"
# The origins of the sites using the service, separated by commas
ALLOWED_ORIGINS = "https://imerss.github.io,http://localhost:1313"
